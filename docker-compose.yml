version: '3.8'

services:
  zephyr-blog-frontend:
    container_name: zephyr-blog-frontend
    # 构建完镜像 push 到远程镜像仓库
    image: crpi-aryws89tr60k6fmc.cn-hangzhou.personal.cr.aliyuncs.com/shenzhien/zephyr-blog-frontend:1.0
    restart: always
    ports:
      - "8081:8081"
    environment:
      # Also set it as runtime environment variable (for server-side rendering if applicable)
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://自己的服务器IP:8080/api}
      - NODE_ENV=production
